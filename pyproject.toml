[project]
    name = "inkibox"
    version = "0.4.1"
    description = "KiCad toolbox: headless Update Symbols / Update PCB / Update Footprints (inkibox update, inkibox check) and file-based design generation"
    readme = "README.md"
    authors = [{ name = "insleker", email = "bkinnightskytw@gmail.com" }]
    requires-python = ">=3.12"
    dependencies = [
        "iflow-mcp-kicad-mcp>=0.1.0",
        "kicad-python>=0.5.0",
        "kicad-sch-api>=0.5.6",
        "kikit>=1.7.2",
        "sexpdata>=1.0.2",
    ]

[dependency-groups]
    dev = [
        "easyeda2kicad>=0.8.0",
        "pre-commit>=4.0.0",
        "pytest>=9.0.2",
        "ruff>=0.14.13",
        "ty>=0.0.1",
    ]


    [project.scripts]
        inkibox = "inkibox.cli:main"

[build-system]
    requires = ["uv_build>=0.10.8,<0.13.0"]
    build-backend = "uv_build"

[tool.pytest.ini_options]
    testpaths = ["tests"]

[tool.uv]
    # floors for transitive dependencies with published advisories (Dependabot alerts
    # 1-5): a later `uv lock` cannot fall back below the patched releases
    constraint-dependencies = [
        "pyjwt>=2.15.0",  # GHSA: RecursionError DoS in unverified payload parsing (via mcp)
        # via pre-commit: activation-script / pyvenv.cfg injection, unchecked seed wheels
        # (GHSA-9h9j-4vrj-gf7g, -94p9-xgh2-xp45, -x78j-v8h9-3j2q, -p58f-9548-mpm2: 21.7.13),
        # GHSA-8rjx-v5ww-45pp / -c947-3pg5-gm8q (21.14.2), GHSA-5vjq-rrrf-7h2q (zsh
        # PROMPT_SUBST, 21.14.4; pypa/virtualenv repository advisories)
        "virtualenv>=21.14.4",
    ]
